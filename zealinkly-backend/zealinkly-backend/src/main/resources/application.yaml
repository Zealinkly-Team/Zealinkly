# 主配置（可提交）。敏感信息在 application-local.yaml（已 gitignore，不提交）
spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: zealinkly-backend
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    # 数据库连接信息请在 application-local.yaml 中配置
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zealinkly_db?TimeZone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      # Redis 连接信息请在 application-local.yaml 中配置
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      repositories:
        enabled: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  # JWT 密钥请在 application-local.yaml 中配置
  secret: ${JWT_SECRET:change-me-please-set-in-local-config}
  expiration: 604800000

# LangChain4j配置（用于意图识别）
langchain4j:
  # DeepSeek兼容OpenAI API，使用open-ai配置
  open-ai:
    chat-model:
      base-url: ${LANGCHAIN4J_BASE_URL:https://api.deepseek.com}
      api-key: ${LANGCHAIN4J_API_KEY:}
      model-name: ${LANGCHAIN4J_MODEL_NAME:deepseek-chat}
      temperature: ${LANGCHAIN4J_TEMPERATURE:0.7}
      log-requests: ${LANGCHAIN4J_LOG_REQUESTS:false}
      log-responses: ${LANGCHAIN4J_LOG_RESPONSES:false}

# DeepSeek API（可选，不配置时 AI 会返回提示语）
# 每月 1 号 0 点给老人发放的积分数量
app:
  deepseek:
    # DeepSeek API Key 请在 application-local.yaml 中配置，或使用环境变量 DEEPSEEK_API_KEY
    api-key: ${DEEPSEEK_API_KEY:}
  baidu-ocr:
    # 百度OCR配置（请在 application-local.yaml 中配置）
    app-id: ${BAIDU_OCR_APP_ID:}
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
  baidu-asr:
    # 百度语音识别配置（请在 application-local.yaml 中配置）
    app-id: ${BAIDU_ASR_APP_ID:}
    api-key: ${BAIDU_ASR_API_KEY:}
    secret-key: ${BAIDU_ASR_SECRET_KEY:}
  points:
    # 每月给老人发放的积分数量
    monthly-elder-points: ${MONTHLY_ELDER_POINTS:100}
    # 任务奖励积分的默认值（如果用户不指定）
    default-task-reward: ${DEFAULT_TASK_REWARD:0}
    # 用户初始积分数值
    initial-elder-points: ${INITIAL_ELDER_POINTS:0}
    initial-volunteer-points: ${INITIAL_VOLUNTEER_POINTS:0}
  file:
    # 文件上传配置
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    base-url: ${FILE_BASE_URL:http://localhost:8080/api/files}
    max-size: ${FILE_MAX_SIZE:10485760}  # 10MB
