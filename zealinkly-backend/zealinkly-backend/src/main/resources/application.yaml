# 主配置（可提交）。敏感信息在 application-local.yaml（已 gitignore，不提交）
spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: zealinkly-backend
  datasource:
    url: jdbc:postgresql://43.143.226.28:5432/zealinkly_db
    username: postgres
    password: ZEAL-LINK
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ''
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      repositories:
        enabled: false

jwt:
  secret: change-me
  expiration: 604800000
